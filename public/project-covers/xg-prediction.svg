<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient-xg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1929;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d4d4d;stop-opacity:1" />
    </linearGradient>
    <filter id="noise-xg">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix in="colorNoise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues="0 .1"/>
      </feComponentTransfer>
    </filter>
    <marker id="arrowhead-xg" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#5eead4" opacity="0.5"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="url(#bg-gradient-xg)"/>
  <rect width="800" height="500" rx="12" fill="url(#bg-gradient-xg)" opacity="0.3" filter="url(#noise-xg)"/>
  
  <!-- Title -->
  <text x="60" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#ffffff">Open xG Prediction Model</text>
  <text x="60" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#5eead4" opacity="0.8">ML goal probability prediction</text>
  
  <!-- Center visual: Soccer field with probability visualization -->
  <g transform="translate(400, 250)">
    <!-- Soccer field (simplified) -->
    <rect x="-80" y="-50" width="160" height="100" rx="4" stroke="#5eead4" stroke-width="2" fill="none" opacity="0.4"/>
    <!-- Center circle -->
    <circle cx="0" cy="0" r="25" stroke="#5eead4" stroke-width="1.5" fill="none" opacity="0.3"/>
    <!-- Goal area -->
    <rect x="-80" y="-15" width="20" height="30" rx="2" stroke="#5eead4" stroke-width="1.5" fill="none" opacity="0.3"/>
    <rect x="60" y="-15" width="20" height="30" rx="2" stroke="#5eead4" stroke-width="1.5" fill="none" opacity="0.3"/>
    
    <!-- Probability indicator (xG value) -->
    <circle cx="30" cy="-20" r="15" stroke="#5eead4" stroke-width="2" fill="none" opacity="0.6"/>
    <text x="30" y="-15" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#5eead4" text-anchor="middle" opacity="0.8">xG</text>
    
    <!-- Prediction arrow/path -->
    <path d="M -30 -10 L 20 -20" stroke="#5eead4" stroke-width="2.5" fill="none" opacity="0.6" marker-end="url(#arrowhead-xg)"/>
  </g>
</svg>

