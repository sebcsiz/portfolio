<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient-spoof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1929;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d4d4d;stop-opacity:1" />
    </linearGradient>
    <filter id="noise-spoof">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix in="colorNoise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues="0 .1"/>
      </feComponentTransfer>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="url(#bg-gradient-spoof)"/>
  <rect width="800" height="500" rx="12" fill="url(#bg-gradient-spoof)" opacity="0.3" filter="url(#noise-spoof)"/>
  
  <!-- Title -->
  <text x="60" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#ffffff">Browser Fingerprint Spoofer</text>
  <text x="60" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#5eead4" opacity="0.8">Chrome extension privacy tool</text>
  
  <!-- Center visual: Browser with fingerprint masking -->
  <g transform="translate(400, 250)">
    <!-- Browser window frame -->
    <rect x="-100" y="-60" width="200" height="120" rx="6" stroke="#5eead4" stroke-width="3" fill="none" opacity="0.7"/>
    <!-- Browser tabs -->
    <rect x="-95" y="-55" width="60" height="10" rx="3" stroke="#5eead4" stroke-width="2" fill="#5eead4" fill-opacity="0.1" opacity="0.6"/>
    <rect x="-30" y="-55" width="60" height="10" rx="3" stroke="#5eead4" stroke-width="2" fill="none" opacity="0.4"/>
    <!-- Address bar -->
    <rect x="-95" y="-40" width="190" height="12" rx="2" stroke="#5eead4" stroke-width="1.5" fill="none" opacity="0.3"/>
    
    <!-- Fingerprint pattern (detailed) -->
    <g opacity="0.6">
      <path d="M -50 -25 Q -40 -35 -25 -30 Q -10 -25 0 -30 Q 10 -25 25 -30 Q 40 -35 50 -25" 
            stroke="#5eead4" stroke-width="2.5" fill="none"/>
      <path d="M -40 -10 Q -30 -20 -15 -15 Q 0 -10 15 -15 Q 30 -20 40 -10" 
            stroke="#5eead4" stroke-width="2.5" fill="none"/>
      <path d="M -35 5 Q -25 -5 -10 0 Q 5 5 20 0 Q 35 -5 45 5" 
            stroke="#5eead4" stroke-width="2.5" fill="none"/>
      <path d="M -30 20 Q -20 10 -5 15 Q 10 20 25 15 Q 40 10 50 20" 
            stroke="#5eead4" stroke-width="2.5" fill="none"/>
    </g>
    
    <!-- Privacy mask overlay (crossed out effect) -->
    <line x1="-60" y1="-35" x2="60" y2="35" stroke="#5eead4" stroke-width="3" opacity="0.5" stroke-dasharray="6,4"/>
    <line x1="60" y1="-35" x2="-60" y2="35" stroke="#5eead4" stroke-width="3" opacity="0.5" stroke-dasharray="6,4"/>
  </g>
</svg>

