<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient-data" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1929;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d4d4d;stop-opacity:1" />
    </linearGradient>
    <filter id="noise-data">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix in="colorNoise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues="0 .1"/>
      </feComponentTransfer>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="url(#bg-gradient-data)"/>
  <rect width="800" height="500" rx="12" fill="url(#bg-gradient-data)" opacity="0.3" filter="url(#noise-data)"/>
  
  <!-- Title -->
  <text x="60" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#ffffff">Data Analytics Project</text>
  <text x="60" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#5eead4" opacity="0.8">Soccer dataset visualizations</text>
  
  <!-- Center visual: Interactive data visualization -->
  <g transform="translate(400, 250)">
    <!-- Chart container -->
    <rect x="-110" y="-70" width="220" height="140" rx="8" stroke="#5eead4" stroke-width="2" fill="none" opacity="0.3"/>
    
    <!-- Chart axes -->
    <line x1="-100" y1="60" x2="100" y2="60" stroke="#5eead4" stroke-width="2.5" opacity="0.6"/>
    <line x1="-100" y1="60" x2="-100" y2="-60" stroke="#5eead4" stroke-width="2.5" opacity="0.6"/>
    
    <!-- Bar chart with gradient effect -->
    <rect x="-80" y="20" width="25" height="40" fill="#5eead4" opacity="0.3" rx="2"/>
    <rect x="-80" y="20" width="25" height="15" fill="#5eead4" opacity="0.5" rx="2"/>
    
    <rect x="-45" y="-15" width="25" height="75" fill="#5eead4" opacity="0.3" rx="2"/>
    <rect x="-45" y="-15" width="25" height="30" fill="#5eead4" opacity="0.5" rx="2"/>
    
    <rect x="-10" y="25" width="25" height="35" fill="#5eead4" opacity="0.3" rx="2"/>
    <rect x="-10" y="25" width="25" height="12" fill="#5eead4" opacity="0.5" rx="2"/>
    
    <rect x="25" y="-30" width="25" height="90" fill="#5eead4" opacity="0.3" rx="2"/>
    <rect x="25" y="-30" width="25" height="40" fill="#5eead4" opacity="0.5" rx="2"/>
    
    <rect x="60" y="-5" width="25" height="65" fill="#5eead4" opacity="0.3" rx="2"/>
    <rect x="60" y="-5" width="25" height="25" fill="#5eead4" opacity="0.5" rx="2"/>
    
    <!-- Smooth trend line overlay -->
    <path d="M -80 40 Q -30 -10 10 -10 T 85 15" stroke="#5eead4" stroke-width="3" fill="none" opacity="0.7"/>
  </g>
</svg>

