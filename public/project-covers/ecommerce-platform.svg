<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1929;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d4d4d;stop-opacity:1" />
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix in="colorNoise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues="0 .1"/>
      </feComponentTransfer>
    </filter>
  </defs>
  
  <!-- Background with gradient and rounded corners -->
  <rect width="800" height="500" rx="12" fill="url(#bg-gradient)"/>
  <rect width="800" height="500" rx="12" fill="url(#bg-gradient)" opacity="0.3" filter="url(#noise)"/>
  
  <!-- Title (Top-left) -->
  <text x="60" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#ffffff">E-Commerce Platform</text>
  <text x="60" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#5eead4" opacity="0.8">Full-stack shopping solution</text>
  
  <!-- Center visual: Shopping cart with product items -->
  <g transform="translate(400, 250)">
    <!-- Shopping cart -->
    <rect x="-70" y="10" width="140" height="90" rx="6" stroke="#5eead4" stroke-width="3" fill="none" opacity="0.7"/>
    <!-- Cart handle -->
    <path d="M -50 10 Q -60 0 -60 -10 Q -60 -20 -50 -20 L 50 -20 Q 60 -20 60 -10 Q 60 0 50 10" 
          stroke="#5eead4" stroke-width="3" fill="none" opacity="0.7"/>
    <!-- Product boxes inside cart -->
    <rect x="-55" y="25" width="35" height="35" rx="3" stroke="#5eead4" stroke-width="2" fill="#5eead4" opacity="0.15"/>
    <rect x="-15" y="25" width="35" height="35" rx="3" stroke="#5eead4" stroke-width="2" fill="#5eead4" opacity="0.15"/>
    <rect x="25" y="25" width="35" height="35" rx="3" stroke="#5eead4" stroke-width="2" fill="#5eead4" opacity="0.15"/>
    <!-- Shopping bag handles -->
    <path d="M -45 -15 Q -45 -25 -35 -25" stroke="#5eead4" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M 45 -15 Q 45 -25 35 -25" stroke="#5eead4" stroke-width="2.5" fill="none" opacity="0.6"/>
  </g>
</svg>

